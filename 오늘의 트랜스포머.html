function getCharacter(num) {
  return data[num] || {
    name: "???" + num,
    msg: "데이터 없음",
    score: [3,3,3,3,3]
  };
}

// 점수 렌더링
function renderScore(score) {
  const icons = ["💖", "🛡", "💰", "🏅", "🍀"];

  return `
    <div class="score-box">
      <div>${icons[0].repeat(score[0])}</div>
      <div>${icons[1].repeat(score[1])}</div>
      <div>${icons[2].repeat(score[2])}</div>
      <div>${icons[3].repeat(score[3])}</div>
      <div>${icons[4].repeat(score[4])}</div>
    </div>
  `;
}

let deck = [];
let clickOrder = 0;

function start() {
  const count = parseInt(document.getElementById("count").value);
  const container = document.getElementById("cards");

  container.innerHTML = "";
  deck = [];
  clickOrder = 0;

  let numbers = Array.from({ length: 78 }, (_, i) => i);

  for (let i = numbers.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i));
    [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
  }

  deck = numbers.slice(0, count);

  for (let i = 0; i < count; i++) {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.index = i;

    card.onclick = reveal;

    container.appendChild(card);
  }
}

function reveal(e) {
  const card = e.currentTarget;
  const index = card.dataset.index;

  if (card.dataset.opened === "true") return;

  clickOrder++;

  const num = deck[index];
  const result = getCharacter(num);

  card.classList.add("open");

  card.innerHTML = `
    <div class="order">${clickOrder}번째</div>
    <div class="number">${result.title}</div>
    <div class="header"><div class="name">${result.name}</div></div>
    <div class="message">${result.msg}</div>
    ${renderScore(result.score)}
  `;

  const isReverseEnabled = document.getElementById("reverseToggle").checked;
let isReversed = false;

if (isReverseEnabled) {
  isReversed = Math.random() < 0.5;
}
  if (isReversed) {
  card.classList.add("reversed");
}
  
  card.dataset.opened = "true";
}
</script>
